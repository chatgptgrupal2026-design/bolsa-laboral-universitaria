name: Pruebas Bolsa Laboral

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis de JavaScript
        run: |
          node --check app.js
          node --check student.js
          node --check portal.js
          node --check workspace.js
      - name: Probar consultas públicas y permisos
        run: node tests/smoke.mjs
